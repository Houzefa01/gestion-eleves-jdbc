# ============================================================================
# Configuration base de données - GestionEleves
# ============================================================================
#   Deux modes sont possibles :
#
#   1) MODE PRESET (recommandé) :
#      Définir db.type parmi : mariadb, mysql, postgresql, access
#      Les drivers et URLs sont alors construits automatiquement.
#      Il suffit de renseigner db.host, db.port, db.name, db.username, db.password.
#
#   2) MODE MANUEL :
#      Laisser db.type vide et renseigner db.driver et db.url directement.
#      Utile pour des configurations exotiques ou des DSN personnalisés.
# ============================================================================

# ---- Mode preset (décommenter et adapter) ----

# === MariaDB (par défaut) ===
db.type=access
db.path=./gestion_eleves.accdb
db.username=
db.password=

# === MySQL ===
# db.type=mysql
# db.host=localhost
# db.port=3306
# db.name=gestion_eleves
# db.username=root
# db.password=

# === PostgreSQL ===
# db.type=postgresql
# db.host=localhost
# db.port=5432
# db.name=gestion_eleves
# db.username=postgres
# db.password=

# === MS Access ===
# db.type=access
# db.path=./gestion_eleves.accdb
# db.username=
# db.password=
#
# JARs requis dans lib/ (télécharger depuis Maven Central) :
#   ucanaccess-5.x.x.jar
#   hsqldb-2.x.x.jar
#   jackcess-4.x.x.jar
#   commons-lang3-3.x.x.jar
#   commons-logging-1.x.x.jar

# ---- Mode manuel (laisser db.type vide, décommenter ci-dessous) ----
# db.driver=org.mariadb.jdbc.Driver
# db.url=jdbc:mariadb://localhost:3306/gestion_eleves
# db.username=root
# db.password=
